<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ionia FC · Clubs Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.t-pct{--bg:#0f1623;--card:#182133;--card2:#1f2a3f;--line:#2a3550;--tx:#eef2f7;--mut:#8b97ab;--acc:#22d3ee;--good:#22c55e;--mid:#f59e0b;--bad:#ef4444;--r8:#4ade80;--r7:#a3e635;--r6:#fbbf24;--r5:#f87171;--rad:12px;--font:"Open Sans",Arial,Helvetica,sans-serif}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}

 .lds{grid-template-columns:1fr 1fr}.ab{grid-template-columns:1fr 84px 52px}.abb{grid-column:1/-1;grid-row:2}.cb{grid-template-columns:38px 1fr 38px 84px}.tile b{font-size:21px}.sc{font-size:21px;padding:6px 10px}.tm img{width:34px;height:34px}.tm b{font-size:13.5px}
 .nh{flex-direction:column;align-items:flex-start}.logo{font-size:18px}}
