name: Update stats

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        run: python scripts/collect.py
      - name: Save new matches
        run: |
          git add data/raw site/data.json site/crest.png
          if ! git diff --cached --quiet; then
            git -c user.name="clubs-pulse bot" -c user.email="actions@users.noreply.github.com" commit -m "Update matches"
            git push
          fi
